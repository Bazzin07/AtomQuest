[project]
name = "atomquest-backend"
version = "1.0.0"
description = "FastAPI backend for the AtomQuest goal setting and tracking portal"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0.0",
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",
    "bcrypt>=4.0.1,<4.1",
    "email-validator>=2.2.0",
    "fastapi[standard]>=0.115.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.5",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "faker>=26.0.0",
    "httpx>=0.27.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Allow `from app.xxx import ...` when running pytest from the /app dir in Docker
pythonpath = ["."]
# Suppress known passlib/bcrypt deprecation noise
filterwarnings = [
    "ignore::DeprecationWarning:passlib",
    "ignore::DeprecationWarning:pkg_resources",
]

[tool.ruff]
line-length = 100
target-version = "py312"
